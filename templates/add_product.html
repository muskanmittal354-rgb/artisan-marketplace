<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Product - Hunar Setu</title>
    <!-- PWA Integration Code -->
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#f97316">
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/static/sw.js')
          .then(reg => console.log('PWA Registered Successfully!'))
          .catch(err => console.log('PWA Registration Failed:', err));
      }
    </script>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f8fafc; color: #1e293b; }
        nav { background-color: #0f172a; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; }
        .logo { color: #f97316; font-size: 24px; font-weight: bold; text-decoration: none; }
        .nav-links a { color: #f8fafc; text-decoration: none; margin-left: 20px; font-weight: 500; transition: color 0.2s; }
        .nav-links a:hover { color: #f97316; }
    </style>
</head>
<body>

    <nav>
        <a href="/" class="logo">Hunar Setu 🎨</a>
        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/artisan">Register Artisan</a>
            <a href="/artisans">View Artisans</a>
            <a href="/products">Products Marketplace</a>
        </div>
    </nav>

    <div class="max-w-xl mx-auto my-10 bg-white p-8 rounded-xl shadow-lg border border-slate-200">
        <div class="flex items-center justify-between mb-6">
            <h2 class="text-2xl font-bold text-slate-900">List New Handicraft Product 🛍️</h2>
            <span class="text-xs bg-orange-100 text-orange-600 font-semibold px-2.5 py-1 rounded-full">Artisan Panel</span>
        </div>

        <form action="/save-product" method="POST" enctype="multipart/form-data" onsubmit="handleSubmitting(this)">
            
            <!-- Product Title -->
            <div class="mb-5">
                <label class="block mb-2 font-semibold text-sm text-slate-700">Product Title</label>
                <input type="text" name="title" placeholder="e.g. Handmade Clay Pot" required
                    class="w-full px-4 py-2.5 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-transparent transition">
            </div>

            <!-- Price -->
            <div class="mb-5">
                <label class="block mb-2 font-semibold text-sm text-slate-700">Price (₹)</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400 font-medium">₹</span>
                    <input type="number" name="price" placeholder="450" required
                        class="w-full pl-8 pr-4 py-2.5 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-transparent transition">
                </div>
            </div>

            <!-- Select Artisan -->
            <div class="mb-5">
                <label class="block mb-2 font-semibold text-sm text-slate-700">Select Artisan</label>
                <select name="artisan_name" required
                    class="w-full px-4 py-2.5 border border-slate-300 rounded-lg text-sm bg-white focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-transparent transition">
                    <option value="">Choose Artisan</option>
                    {% for artisan in artisans %}
                        <option value="{{ artisan.name }}">{{ artisan.name }} ({{ artisan.category }})</option>
                    {% endfor %}
                </select>
            </div>

            <!-- Image Upload & Preview Section -->
            <div class="mb-5 p-4 bg-slate-50 border border-dashed border-slate-300 rounded-xl">
                <label class="block mb-2 font-semibold text-sm text-slate-700">Upload Image File</label>
                <input type="file" name="image_file" id="imageFileInput" accept="image/*" onchange="previewImage(event)"
                    class="w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-orange-50 file:text-orange-600 hover:file:bg-orange-100 cursor-pointer">

                <div class="text-center my-2 text-xs font-bold text-slate-400">--- OR ---</div>

                <label class="block mb-2 font-semibold text-sm text-slate-700">Image URL Link</label>
                <input type="text" name="image_url" id="imageUrlInput" placeholder="https://example.com/photo.jpg" oninput="previewUrlImage(this.value)"
                    class="w-full px-4 py-2 border border-slate-300 rounded-lg text-sm bg-white focus:outline-none focus:ring-2 focus:ring-orange-500 transition">

                <!-- Live Image Preview Container -->
                <div id="imagePreviewContainer" class="mt-4 hidden">
                    <p class="text-xs font-semibold text-slate-500 mb-1">Image Preview:</p>
                    <img id="previewImg" src="" alt="Preview" class="w-32 h-32 object-cover rounded-lg border border-slate-200 shadow-sm">
                </div>
            </div>

            <!-- Description -->
            <div class="mb-6">
                <label class="block mb-2 font-semibold text-sm text-slate-700">Description</label>
                <textarea name="description" rows="3" placeholder="Handcrafted details, material used..." required
                    class="w-full px-4 py-2.5 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-transparent transition"></textarea>
            </div>

            <!-- Submit Button -->
            <button type="submit" id="submitBtn"
                class="w-full bg-orange-600 hover:bg-orange-700 text-white font-bold py-3 px-4 rounded-lg shadow-md transition duration-200 flex items-center justify-center space-x-2">
                <span>Save Product</span>
            </button>
        </form>
    </div>

    <!-- JavaScript for Live Preview & Loading State -->
    <script>
        function previewImage(event) {
            const file = event.target.files[0];
            const container = document.getElementById('imagePreviewContainer');
            const preview = document.getElementById('previewImg');
            const urlInput = document.getElementById('imageUrlInput');

            if (file) {
                // Clear URL input if file is selected
                urlInput.value = '';
                const reader = new FileReader();
                reader.onload = function(e) {
                    preview.src = e.target.result;
                    container.classList.remove('hidden');
                }
                reader.readAsDataURL(file);
            }
        }

        function previewUrlImage(url) {
            const container = document.getElementById('imagePreviewContainer');
            const preview = document.getElementById('previewImg');
            const fileInput = document.getElementById('imageFileInput');

            if (url.trim() !== '') {
                // Clear file input if URL is provided
                fileInput.value = '';
                preview.src = url;
                container.classList.remove('hidden');
            } else {
                container.classList.add('hidden');
            }
        }

        function handleSubmitting(form) {
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerHTML = `<svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            <span>Saving Product...</span>`;
        }
    </script>
</body>
</html>
